<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hop-tu-Naa · Pad Arcade</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="flash"></div>
    <div id="distance"></div>
    <!-- Lives are the three legs of Man: each crash costs one. -->
    <svg id="legs" viewBox="-50 -50 100 100" aria-label="Lives">
      <circle class="disc" r="48" />
      <g class="leg"><path d="M0 0 L-3 -30 L22 -39 L30 -33" /></g>
      <g class="leg" transform="rotate(120)"><path d="M0 0 L-3 -30 L22 -39 L30 -33" /></g>
      <g class="leg" transform="rotate(240)"><path d="M0 0 L-3 -30 L22 -39 L30 -33" /></g>
    </svg>
    <div id="lanes">
      <div class="pad p1" data-name="PAD 1">
        <div class="lane"><b>←</b><small>hold</small><i class="hold"></i></div>
        <div class="lane"><b>←</b><small>tap</small></div>
        <div class="lane"><b>→</b><small>tap</small></div>
      </div>
      <div class="pad p2" data-name="PAD 2">
        <div class="lane"><b>←</b><small>tap</small></div>
        <div class="lane"><b>→</b><small>tap</small></div>
        <div class="lane"><b>→</b><small>hold</small><i class="hold"></i></div>
      </div>
    </div>
    <div id="overlay"></div>
  </body>
</html>
